{% load static %}
<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blog{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/output.css' %}">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="flex flex-col min-h-full text-slate-800 antialiased" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    <!-- Barre de Navigation -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50" x-data="{ open: false }">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="{% url 'index' %}" class="text-xl font-black text-indigo-600 flex items-center gap-2">
                <i data-lucide="terminal" class="w-6 h-6"></i>
                <span>Blog</span>
            </a>

            <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
                <a href="{% url 'index' %}" class="text-slate-600 hover:text-indigo-600 transition">Articles</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'add-post' %}" class="inline-flex items-center gap-2 bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-indigo-700 transition shadow-sm">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> Nouveau Post
                    </a>
                {% endif %}
            </nav>

            <button @click="open = !open" class="md:hidden p-2 text-slate-600">
                <i data-lucide="menu" x-show="!open" class="w-6 h-6"></i>
                <i data-lucide="x" x-show="open" class="w-6 h-6" x-cloak></i>
            </button>
        </div>

        <!-- Menu Mobile -->
        <div x-show="open" x-cloak class="md:hidden border-b border-slate-200 bg-white px-4 py-4 flex flex-col gap-3">
            <a href="{% url 'index' %}" class="text-slate-600 font-medium">Articles</a>
            {% if user.is_authenticated %}
                <a href="{% url 'add-post' %}" class="text-indigo-600 font-semibold flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> Nouveau Post
                </a>
            {% endif %}
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Pied de page -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-slate-500 text-sm mt-auto">
        <p>&copy; {% now "Y" %} Blog</p>
    </footer>

    <script>
        lucide.createIcons();
        document.body.addEventListener('htmx:afterSettle', function() {
            lucide.createIcons();
        });
    </script>
</body>
</html>
