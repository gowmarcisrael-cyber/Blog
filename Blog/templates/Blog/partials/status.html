<form hx-post="{% url 'change_status' post.slug %}" hx-target="this" hx-swap="outerHTML">
    {% csrf_token %}
    {% if post.status == 'published' %}
        <input type="hidden" name="status" value="draft">
        <button type="submit" 
                title="Cliquer pour basculer en Brouillon"
                class="px-3 py-1 rounded-lg text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-amber-50 hover:text-amber-700 hover:border-amber-200 transition flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            Publié
        </button>
    {% else %}
        <input type="hidden" name="status" value="published">
        <button type="submit" 
                title="Cliquer pour Publier"
                class="px-3 py-1 rounded-lg text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200 hover:bg-emerald-50 hover:text-emerald-700 hover:border-emerald-200 transition flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-amber-500"></span>
            Brouillon
        </button>
    {% endif %}
</form>
